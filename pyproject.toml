[project]
name = "portfolio-agent-hooks"
version = "0.0.0"
description = "Dev tooling metadata for review-loop Python hooks (not a published package)."
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [".cursor/hooks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = [".cursor/hooks/tests"]
pythonpath = [".cursor/hooks"]
addopts = "-q"
