name: R2 Presign Security Smoke Tests

"on":
  workflow_call:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Security Smoke Tests (r2-presign)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Resolve smoke test endpoint and allowed origin
        env:
          PRESIGN_URL: ${{ secrets.PRESIGN_URL }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          presign_url=""
          if [ -n "${VITE_SUPABASE_URL:-}" ]; then
            presign_url="${VITE_SUPABASE_URL%/}/functions/v1/r2-presign"
          else
            presign_url="${PRESIGN_URL:-}"
          fi

          allowed_origin="$(
            ALLOWED_ORIGIN="${ALLOWED_ORIGIN:-}" \
              ALLOWED_ORIGINS="${ALLOWED_ORIGINS:-}" \
              node scripts/infra/resolve-smoke-allowed-origin.mjs
          )"

          {
            echo "PRESIGN_URL=$presign_url"
            echo "ALLOWED_ORIGIN=$allowed_origin"
          } >> "$GITHUB_ENV"

      - name: Validate required security test secrets
        env:
          PRESIGN_URL: ${{ env.PRESIGN_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for key in PRESIGN_URL SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!key}" ]; then
              missing="$missing $key"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing required secrets:$missing"
            echo "Set the listed missing key(s) above as repository secrets before running this workflow."
            echo "Required secret mappings:"
            echo "- PRESIGN_URL env: secrets.PRESIGN_URL (fallback: secrets.VITE_SUPABASE_URL + /functions/v1/r2-presign)"
            echo "- SUPABASE_URL: secrets.VITE_SUPABASE_URL"
            echo "- SUPABASE_ANON_KEY: secrets.VITE_SUPABASE_ANON_KEY"
            echo "- SUPABASE_SERVICE_ROLE_KEY: secrets.SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run r2-presign security smoke tests
        env:
          PRESIGN_URL: ${{ env.PRESIGN_URL }}
          ALLOWED_ORIGIN: ${{ env.ALLOWED_ORIGIN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run security:test:r2-presign
